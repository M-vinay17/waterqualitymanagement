# project-root/nginx.conf

server {
    listen 80;

    # ── React frontend ───────────────────────────────
    location / {
        root       /usr/share/nginx/html;
        index      index.html;
        try_files  $uri $uri/ /index.html;
    }

    # ── FastAPI REST API ─────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # ── WebSocket ────────────────────────────────────
    # ⚠️ WebSocket కి ఈ 3 lines తప్పనిసరి
    location /api/v1/ws/ {
        proxy_pass             http://backend:8000;
        proxy_http_version     1.1;                    # ← must
        proxy_set_header       Upgrade    $http_upgrade;  # ← must
        proxy_set_header       Connection "upgrade";      # ← must
        proxy_set_header       Host $host;
    }
}
