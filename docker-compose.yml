# project-root/docker-compose.yml

version: "3.9"

services:

  # ── PostgreSQL Database ──────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: waterwatch_db
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──────────────────────────────────
  backend:
    build:
      context:    ./backend
      dockerfile: Dockerfile
    container_name: waterwatch_backend
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      SECRET_KEY:   ${SECRET_KEY}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  # ── React Frontend (Nginx) ───────────────────────────
  frontend:
    build:
      context:    ./frontend
      dockerfile: Dockerfile
    container_name: waterwatch_frontend
    depends_on:
      - backend
    ports:
      - "80:80"

  # ── Redis (future Celery use) ────────────────────────
  redis:
    image: redis:7-alpine
    container_name: waterwatch_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: